apiVersion: apps/v1
kind: Deployment
metadata:
  name: mycoder-backend
  namespace: mycoder-dev
  labels:
    app: mycoder-backend
    tier: api
    env: dev
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: mycoder-backend
      tier: api
      env: dev
  template:
    metadata:
      labels:
        app: mycoder-backend
        tier: api
        env: dev
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: docker.io/replace-with-dockerhub-username/mycoder-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mycoder-backend-config
            - secretRef:
                name: mycoder-backend-secret
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: mycoder-dev
  labels:
    app: mycoder-backend
    tier: api
    env: dev
spec:
  type: ClusterIP
  selector:
    app: mycoder-backend
    tier: api
    env: dev
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
