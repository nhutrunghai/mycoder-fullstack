apiVersion: v1
kind: ConfigMap
metadata:
  name: mycoder-backend-config
  namespace: mycoder-dev
  labels:
    app: mycoder-backend
    tier: api
    env: dev
data:
  # Development public URL exposed by the frontend NodePort.
  PORT: "4000"
  BUILD_MODE: dev
  ALLOWED_ORIGINS: http://192.168.53.128:30080
  FRONTEND_URL: http://192.168.53.128:30080

  # MongoDB database and collection names. DB_URL belongs in the Secret.
  DB_NAME: mycoder
  DB_USER_NAME: users
  DB_COMPANY_NAME: companies
  DB_JOB_NAME: jobs
  DB_JOB_CATEGORY_NAME: job_category
  DB_JOB_PROMOTION_NAME: job_promotions
  DB_JOB_PROMOTION_PLAN_NAME: job_promotion_plans
  DB_WALLET_NAME: wallets
  DB_WALLET_TRANSACTION_NAME: wallet_transactions
  DB_WALLET_TOPUP_ORDER_NAME: wallet_topup_orders
  DB_NOTIFICATION_NAME: notifications
  DB_ADMIN_AUDIT_LOG_NAME: admin_audit_logs
  DB_SYSTEM_SETTING_NAME: system_settings
  DB_FAVORITE_JOB_NAME: favorite_jobs
  DB_RESUME_NAME: resumes
  DB_JOB_APPLICATION_NAME: job_applications
  DB_REFRESH_TOKEN_NAME: refresh_tokens
  DB_OTP_CODE_NAME: otp_codes
  DB_CHAT_SESSION_NAME: chat_sessions

  # Redis. REDIS_PASSWORD belongs in the Secret.
  REDIS_HOST: redis
  REDIS_PORT: "6379"

  # Token and cookie behavior. JWT signing keys belong in the Secret.
  ExpiresIn_ACCESS_TOKEN: 5m
  ExpiresIn_REFRESH_TOKEN: 7d
  ExpiresIn_EMAIL_VERIFY_TOKEN: 24h
  ExpiresIn_FORGOT_PASSWORD_TOKEN: 15m
  AUTH_REFRESH_COOKIE_NAME: mycoder_refresh
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAME_SITE: lax
  ADMIN_SESSION_COOKIE_NAME: mycoder_admin_sid
  ADMIN_SESSION_PREFIX: admin:sessions
  ADMIN_SESSION_TTL: "1800"
  ADMIN_COOKIE_SECURE: "false"
  ADMIN_COOKIE_SAME_SITE: lax

  # Email and file-upload configuration. Provider tokens belong in the Secret.
  MAIL_FROM_ADDRESS: mycoder.example.com
  MAIL_FROM_NAME: MyCoder
  UPLOADTHING_CALLBACK_URL: http://192.168.53.128:30080/api/uploadthing

  # Google OAuth. GOOGLE_CLIENT_SECRET belongs in the Secret.
  GOOGLE_CLIENT_ID: replace-with-google-client-id.apps.googleusercontent.com
  GOOGLE_REDIRECT_URL: http://192.168.53.128:30080/api/v1/auth/oauth/google

  # Search and embedding services.
  ELASTICSEARCH_URL: http://elasticsearch:9200
  PUBLIC_JOBS_SEARCH_INDEX: public_jobs_search
  RESUME_SEARCH_INDEX: candidate_resumes_chunks
  RESUME_EMBEDDING_DIMS: "1536"
  EMBEDDING_API_URL: http://embedding-api:8000

  # AI provider selection and non-secret model settings. Provider API keys belong in the Secret.
  LLM_PROVIDER: openai
  GEMINI_MODEL_INTENT: gemini-2.5-flash
  GEMINI_MODEL_CHAT: gemini-2.5-flash
  GEMINI_API_TIMEOUT_MS: "30000"
  OPENAI_BASE_URL: https://api.openai.com/v1
  OPENAI_MODEL_INTENT: gpt-4o-mini
  OPENAI_MODEL_CHAT: gpt-4o-mini
  OPENAI_MODEL_CV_VISUAL_REVIEW: gpt-4o-mini
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_API_TIMEOUT_MS: "30000"
