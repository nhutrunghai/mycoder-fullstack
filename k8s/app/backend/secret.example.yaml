apiVersion: v1
kind: Secret
metadata:
  name: mycoder-backend-secret
  namespace: mycoder-dev
  labels:
    app: mycoder-backend
    tier: api
    env: dev
type: Opaque
stringData:
  # Database and cache credentials.
  DB_URL: "replace-with-mongodb-connection-string"
  REDIS_PASSWORD: "replace-with-redis-password"

  # Application signing and encryption keys. Use random values with at least 32 characters.
  SECRET_ACCESS_TOKEN: "replace-with-at-least-32-random-characters"
  SECRET_REFRESH_TOKEN: "replace-with-at-least-32-random-characters"
  SYSTEM_SETTINGS_ENCRYPTION_KEY: "replace-with-at-least-32-random-characters"

  # External provider credentials.
  RESEND_API_KEY: "replace-with-resend-api-key"
  UPLOADTHING_TOKEN: "replace-with-uploadthing-token"
  GOOGLE_CLIENT_SECRET: "replace-with-google-client-secret"
  HUGGINGFACE_API_KEY: "replace-with-huggingface-api-key"
  GEMINI_API_KEY: "replace-with-gemini-api-key"
  OPENAI_API_KEY: "replace-with-openai-api-key"

  # SePay configuration. Keep all SePay values in the Secret by policy.
  SEPAY_API_TOKEN: "replace-with-sepay-api-token"
  SEPAY_BANK_ACCOUNT_ID: "replace-with-sepay-bank-account-id"
  SEPAY_BANK_SHORT_NAME: "BIDV"
  SEPAY_BANK_ACCOUNT_NUMBER: "replace-with-bank-account-number"
  SEPAY_BANK_ACCOUNT_HOLDER_NAME: "replace-with-account-holder-name"
  SEPAY_WEBHOOK_SECRET: "replace-with-sepay-webhook-secret"
