services:
  frontend:
    build:
      target: build
    command: npm run dev
    ports: !override
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_DEV_API_PROXY: http://backend:4000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: "no"

  backend:
    build:
      target: build
    command: npm run dev
    environment:
      BUILD_MODE: dev
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    restart: "no"

volumes:
  frontend_node_modules:
  backend_node_modules:
